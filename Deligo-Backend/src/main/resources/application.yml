spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: deligo-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

server:
  servlet:
    context-path: /api

logging:
  level:
    org.hibernate.SQL: debug

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@deligo.local}
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
